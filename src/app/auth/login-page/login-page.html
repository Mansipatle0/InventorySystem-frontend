<div class="login-wrapper">
  <div class="login-card">
    <h1>SmartInventory</h1>
    <p class="subtitle">Manage stock, sales & performance effortlessly.</p>

    <!-- Email -->
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" type="email" placeholder="example@ams.com" />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" placeholder="••••••••" />
    </div>

    <!-- Role Selection -->
    <div class="form-group">
      <label>Login as</label>

      <div class="roles-radio-group">

        <label class="role-option">
          <input
            type="radio"
            name="role"
            (change)="onRoleChange('ADMIN')"
            [checked]="selectedRole === 'ADMIN'"
          />
          <span class="custom-radio"></span>
          <div class="role-text">
            <strong>Admin / Shop Owner</strong>
            <small>Full access & controls</small>
          </div>
        </label>

        <label class="role-option">
          <input
            type="radio"
            name="role"
            (change)="onRoleChange('CASHIER')"
            [checked]="selectedRole === 'CASHIER'"
          />
          <span class="custom-radio"></span>
          <div class="role-text">
            <strong>Cashier / Staff</strong>
            <small>Billing & sales access</small>
          </div>
        </label>

        <label class="role-option">
          <input
            type="radio"
            name="role"
            (change)="onRoleChange('VIEWER')"
            [checked]="selectedRole === 'VIEWER'"
          />
          <span class="custom-radio"></span>
          <div class="role-text">
            <strong>Viewer / Manager</strong>
            <small>View reports & analytics</small>
          </div>
        </label>

      </div>
    </div>

    <!-- Error -->
    @if (errorMessage) {
      <div class="error">{{ errorMessage }}</div>
    }

    <!-- Login Button -->
    <button (click)="login()" [disabled]="isLoading">
      @if (!isLoading) {
        <span>Login as {{ getRoleLabel(selectedRole) }}</span>
      } @else {
        <span>Authenticating...</span>
      }
    </button>

  </div>
</div>
