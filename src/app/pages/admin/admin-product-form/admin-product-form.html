<!-- src/app/pages/admin/admin-product-form/admin-product-form.html -->
<div class="page-wrapper">
  <div class="header-row">
    <h2>Add Product</h2>
    <button class="btn-secondary" (click)="goBack()">
      ← Back to Products
    </button>
  </div>

  <!-- Mode Switch -->
  <div class="mode-switch">
    <button
      class="mode-btn"
      [class.active]="mode === 'SCAN'"
      (click)="switchMode('SCAN')"
    >
      Scan with Wireless Barcode Scanner
    </button>
    <button
      class="mode-btn"
      [class.active]="mode === 'MANUAL'"
      (click)="switchMode('MANUAL')"
    >
      Manual Product Entry
    </button>
  </div>

  <!-- Messages -->
  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>
  <div *ngIf="infoMessage" class="alert alert-info">
    {{ infoMessage }}
  </div>

  <!-- SCAN MODE -->
  <div *ngIf="mode === 'SCAN'" class="card">
    <h3>Scan Barcode</h3>
    <p class="hint">
      Focus the barcode box and scan using your wireless scanner.
      Most scanners automatically send ENTER after scanning.
    </p>

    <div class="field-row">
      <label>Barcode</label>
      <input
        type="text"
        [(ngModel)]="scanBarcode"
        name="scanBarcode"
        placeholder="Scan or type barcode"
        (keyup.enter)="onScanConfirm()"
        autofocus
      />
      <button class="btn-primary" (click)="onScanConfirm()">
        Use Barcode
      </button>
    </div>
  </div>

  <!-- COMMON FORM -->
  <div class="card">
    <h3>Product Details</h3>

    <form (ngSubmit)="onSubmit()" #productForm="ngForm">
      <div class="form-grid">
        <div class="field">
          <label>SKU Code *</label>
          <input
            type="text"
            [(ngModel)]="form.skuCode"
            name="skuCode"
            required
          />
        </div>

        <div class="field">
          <label>Barcode</label>
          <input type="text" [(ngModel)]="form.barcode" name="barcode" />
        </div>

        <div class="field">
          <label>Name *</label>
          <input
            type="text"
            [(ngModel)]="form.name"
            name="name"
            required
          />
        </div>

        <div class="field">
          <label>Category</label>
          <input
            type="text"
            [(ngModel)]="form.category"
            name="category"
          />
        </div>

        <div class="field">
          <label>Unit of Measure</label>
          <input
            type="text"
            [(ngModel)]="form.unitOfMeasure"
            name="unitOfMeasure"
            placeholder="bottle, box, pcs"
          />
        </div>

        <div class="field">
          <label>MRP</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="form.mrp"
            name="mrp"
          />
        </div>

        <div class="field">
          <label>Selling Price</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="form.sellingPrice"
            name="sellingPrice"
          />
        </div>

        <div class="field">
          <label>Min Stock Level</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="form.minStockLevel"
            name="minStockLevel"
          />
        </div>
        <div class="field">
  <label>Current Stock *</label>
  <input
    type="number"
    min="0"
    [(ngModel)]="form.currentStock"
    name="currentStock"
    required
  />
</div>

        <div class="field">
          <label>Status</label>
          <select [(ngModel)]="form.active" name="active">
            <option [ngValue]="true">ACTIVE</option>
            <option [ngValue]="false">INACTIVE</option>
          </select>
        </div>
      </div>

      <div class="actions-row">
        <button
          class="btn-primary"
          type="submit"
          [disabled]="saving || !productForm.form.valid"
        >
          {{ saving ? 'Saving...' : 'Save Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
