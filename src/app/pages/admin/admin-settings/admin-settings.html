<!-- src/app/components/admin-settings/admin-settings.html -->
<div class="section-header">
  <div>
    <h2>System Settings</h2>
    <p class="section-desc">
      Configure basic store details, tax, discount and invoice format.
    </p>
  </div>
</div>

<form class="settings-form" #settingsForm="ngForm">
  <div class="field">
    <label>Shop Name</label>
    <input type="text" [(ngModel)]="shopName" name="shopName" />
  </div>

  <div class="field">
    <label>GST Number</label>
    <input type="text" [(ngModel)]="gstNumber" name="gstNumber" />
  </div>

  <div class="field">
    <label>Store Address</label>
    <textarea rows="3" [(ngModel)]="address" name="address"></textarea>
  </div>

  <div class="two-col">
    <div class="field">
      <label>Invoice Prefix</label>
      <input
        type="text"
        [(ngModel)]="invoicePrefix"
        name="invoicePrefix"
        placeholder="BILL-"
      />
    </div>

    <div class="field">
      <label>Default Tax %</label>
      <input
        type="number"
        [(ngModel)]="taxPercent"
        name="taxPercent"
        min="0"
        step="0.1"
      />
    </div>
  </div>

  <div class="two-col">
    <div class="field">
      <label>Default Discount %</label>
      <input
        type="number"
        [(ngModel)]="discountPercent"
        name="discountPercent"
        min="0"
        step="0.1"
      />
    </div>
  </div>

  <button
    type="button"
    class="btn-primary"
    (click)="onSave()"
    [disabled]="saving"
  >
    {{ saving ? 'Saving...' : 'Save Settings' }}
  </button>

  @if (saveMessage) {
    <p class="save-msg">{{ saveMessage }}</p>
  }
</form>
