<div class="layout-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-circle">SI</span>
      <span class="brand-text">SmartInventory</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>📊</span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/pos" routerLinkActive="active">
        <span>🧾</span>
        <span>POS / Billing</span>
      </a>
      <a routerLink="/products" routerLinkActive="active">
        <span>📦</span>
        <span>Products</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" routerLink="/login">
        ⏏ Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1>Inventory Management</h1>
        <p class="subtitle">Universal Barcode-Based Inventory & POS</p>
      </div>
      <div class="topbar-right">
        <div class="user-info">
          <span class="user-name">AMS (Admin)</span>
          <span class="user-role">Admin</span>
        </div>
        <div class="datetime">
          {{ today| date:'medium' }}
        </div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
